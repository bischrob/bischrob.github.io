project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - posts.qmd
    - projects.qmd
    - dissertation-story-map.qmd
    - about.qmd
    - posts/**/*.qmd

website:
  title: "Robert J. Bischoff"
  site-url: https://bischrob.github.io/
  description: "Robert J. Bischoff's personal website and blog containing posts on archaeology, R, and data science."
  navbar:
    right:
      - posts.qmd
      - projects.qmd
      - dissertation-story-map.qmd
      - about.qmd
      - icon: github
        href: https://github.com/bischrob
      - icon: rss
        href: index.xml
  google-analytics: "G-WBBYPE7DC2"
  
format:
  html:
    theme: slate
    css: 
      - styles.css
      - https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap
    include-in-header:
      - metricool.js



